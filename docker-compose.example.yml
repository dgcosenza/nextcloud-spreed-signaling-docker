# Hardened rootless + read-only compose example for dgcosenza/nextcloud-spreed-signaling
#
# Pin production deployments by @sha256 digest and supply all keys/secrets via
# a .env file or secrets manager (never commit secrets). Runs as non-root
# `spreedbackend` (850:850) with a read-only root filesystem and all Linux
# capabilities dropped by writing the generated config to /tmp/server.conf.

services:
  talk_signaling:
    image: dgcosenza/nextcloud-spreed-signaling:latest
    container_name: nextcloud_talk_signaling
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    environment:
      CONFIG: "/tmp/server.conf"
      HTTP_LISTEN: ":8080"
      NATS_URL: "nats://loopback"
      HASH_KEY: "${SIGNALING_HASH_KEY}"
      BLOCK_KEY: "${SIGNALING_BLOCK_KEY}"
      INTERNAL_SHARED_SECRET_KEY: "${SIGNALING_INTERNAL_SECRET}"
      BACKENDS: "cloud"
      BACKEND_CLOUD_URLS: "https://cloud.example.com"
      BACKEND_CLOUD_SHARED_SECRET: "${SIGNALING_BACKEND_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/welcome"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    networks:
      - nextcloud_internal

networks:
  nextcloud_internal:
    internal: true
